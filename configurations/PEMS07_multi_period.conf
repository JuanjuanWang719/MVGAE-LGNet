[Data]
graph_signal_matrix_filename = ./data/PEMS07/PEMS07.npz
; PEMS07 距离边与 PEMS08 相同，使用 PEMS07.csv（from,to,cost）
adj_filename = ./data/PEMS07/PEMS07.csv
mvgae_adj_filename = ./data/PEMS07/mvgae_adj.npy
z_init_filename = ./data/PEMS07/z_init.npy
mvgae_checkpoint_filename = ./data/PEMS07/mvgae_pretrain.pt
use_mvgae_adj = False
; 完整实验：使用第一阶段 MVGAE 预训练 Z_init（消融见 configurations/ablation/）
use_mvgae_pretrain = True
use_node_embed = True
; 若 z_init 不存在则自动跑 MVGAE 预训练
auto_pretrain = True
num_of_vertices = 883
points_per_hour = 12
num_for_predict = 12
; week(12) + day(12) + hour(12) = 36
len_input = 36
dataset_name = PEMS07

[MVGAE]
epochs = 400
lr = 0.0005
latent = 48
num_heads = 4
variational = True
gcn_layers = 2
fusion_dim = 16
patience = 40
kl_weight = 1.0
diversity_weight = 0.1
static_feature_dim = 4
seed = 42
corr_threshold = 0.95
corr_top_k = 5
adj_threshold = 0.55
adj_top_k = 8
train_ratio = 0.6
; 第一阶段路网边比例（稳定性实验见 configurations/stability/）
pretrain_data_ratio = 1.0

[Hybrid]
local_hidden = 64
global_d_model = 64
global_nhead = 4
global_layers = 2
gwnet_blocks = 4
gwnet_layers = 2
gwnet_nhid = 32
gcn_bool = True
addaptadj = True
gwnet_dropout = 0.3
fusion_dim = 64
dropout = 0.1
; ASTGCN 式分路：week/day/hour 各 12 步独立编码再融合
period_split = True
; 局部分支-全局分支融合：gated（完整）/ sum（消融加和）
fusion_mode = gated
use_local_branch = True
use_global_branch = True
joint_finetune_mvgae = False
end_to_end_mvgae = False
; 跨数据集空间迁移见 configurations/transfer/
transfer_encoder = False
z_lr_scale = 0.15
eval_test_every = 10
patience = 25
log_every = 100

[Training]
ctx = 0
in_channels = 1
nb_block = 2
K = 3
nb_chev_filter = 64
nb_time_filter = 64
; 节点数 883，显存不足时可改为 32
batch_size = 64
model_name = hybrid_st_period_best
dataset_name = PEMS07
; 上周 + 昨天 + 最近 1 小时
num_of_weeks = 1
num_of_days = 1
num_of_hours = 1
start_epoch = 0
epochs = 100
learning_rate = 0.0005
seed = 42
cudnn_deterministic = False
loss_function = mse
mse_weight = 0.5
huber_beta = 1.0
lr_scheduler = none
cosine_eta_min = 1e-6
metric_method = unmask
missing_value = 0.0
